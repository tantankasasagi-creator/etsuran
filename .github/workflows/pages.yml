name: Verify and publish etsuran
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and regression tests
        run: |
          node --check app.js
          node --check < gas/Code.gs
          node tests/api.test.cjs
          TZ=Asia/Tokyo node tests/gas.test.cjs
          TZ=UTC node tests/gas.test.cjs
          TZ=Asia/Tokyo node tests/gas-ranking.test.cjs
      - name: Build static site
        run: node tools/build-site.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
