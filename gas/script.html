<script>
let viewerAccessToken = '';


const API_URL = 'https://script.google.com/macros/s/AKfycbyLL7ZKPhH_XIHJh_zsCfaWrkTmbsCwC0WekUxpjBI_gcB2TLpnpYpnHHCYH0XuofiN1w/exec';

function normalizeRankingData(data) {
  if (data.currentMonth && data.currentYear) return data;
  const now = new Date();
  const year = Number.isInteger(data.currentYearNumber) ? data.currentYearNumber : now.getFullYear();
  const month = Number.isInteger(data.currentMonthNumber) ? data.currentMonthNumber : now.getMonth();
  const result = { all: data.all || {}, currentMonth: {}, currentYear: {} };
  Object.keys(result.all).forEach(function (person) {
    result.currentYear[person] = result.all[person].filter(item => item.year === year);
    result.currentMonth[person] = result.currentYear[person].filter(item => item.month === month);
  });
  return result;
}

// Cache stays in memory: financial data is never persisted to browser storage.
const apiReadCache = new Map();
const apiPendingReads = new Map();
const API_CACHE_TTL = 60 * 1000;
let apiCacheGeneration = 0;
let activeApiRequests = 0;
let activeSpeculativeRequests = 0;
const apiReadStates = new Map();
let latestApiError = '';
let lastApiUpdate = null;

function updateConnectionStatus() {
  const status = document.getElementById('connectionStatus');
  const button = document.getElementById('refreshDataButton');
  if (!status) return;
  const foregroundBusy = activeApiRequests > activeSpeculativeRequests;
  status.classList.toggle('is-loading', foregroundBusy);
  status.classList.toggle('is-error', !foregroundBusy && !!latestApiError);
  status.textContent = foregroundBusy
    ? 'データを読み込み中…'
    : latestApiError || (lastApiUpdate
      ? '更新 ' + lastApiUpdate.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
      : '');
  if (button) button.disabled = foregroundBusy || budgetSavePending;
}

function refreshVisibleData() {
  if (activeApiRequests > activeSpeculativeRequests || budgetSavePending) return;
  invalidateApiCache();
  latestApiError = '';
  const visible = id => !document.getElementById(id).classList.contains('hidden');
  if (visible('homeScreen')) loadAllHomeData(currentPerson);
  else if (visible('budgetScreen')) loadBudgetData();
  else if (visible('calendarScreen')) loadCalendarData();
  else if (visible('assetScreen')) loadAssetData();
  else {
    const views = [
      ['trendScreen', getMonthlyTrendDataApi, data => { trendDataCache = data; renderTrendChart(); }],
      ['rankingScreen', getRankingDataApi, data => { rankingDataCache = data; renderRankingScreen(); }],
      ['balanceScreen', getBalanceDataApi, data => { balanceDataCache = data; renderBalanceScreen(); }]
    ];
    const view = views.find(entry => visible(entry[0]));
    if (view) {
      const targetId = { trendScreen: 'trendChartCard', rankingScreen: 'rankingList', balanceScreen: 'balanceSummaryCard' }[view[0]];
      const target = document.getElementById(targetId);
      showLoadingState(target, true);
      view[1]().then(view[2]).catch(error => showErrorState(target, error, refreshVisibleData));
    }
  }
}

const viewRequests = new Map();

function beginViewRequest(view) {
  const id = (viewRequests.get(view) || 0) + 1;
  viewRequests.set(view, id);
  return () => viewRequests.get(view) === id;
}

function invalidateApiCache() {
  apiCacheGeneration++;
  prefetchQueue.clear();
  prefetchPlanKey = '';
  apiReadCache.clear();
  apiPendingReads.clear();
  apiReadStates.clear();
  homeDataCache = null;
  trendDataCache = null;
  balanceDataCache = null;
  rankingDataCache = null;
  assetDataCache = {};
  budgetDataCache = null;
}

function getCachedApiData(action, params = {}) {
  const cached = apiReadCache.get(JSON.stringify([action, params]));
  if (!cached || Date.now() - cached.time >= API_CACHE_TTL) return undefined;
  return cached.data;
}

function callApi(action, params = {}, options = {}) {
  const isRead = action.startsWith('get');
  const key = JSON.stringify([action, params]);
  const cached = apiReadCache.get(key);
  if (isRead && cached && Date.now() - cached.time < API_CACHE_TTL) {
    return Promise.resolve(cached.data);
  }
  if (isRead && apiPendingReads.has(key)) {
    const state = apiReadStates.get(key);
    if (state && state.speculative && !options.speculative) {
      state.speculative = false;
      activeSpeculativeRequests--;
      updateConnectionStatus();
    }
    return apiPendingReads.get(key);
  }

  const state = { speculative: !!options.speculative };
  activeApiRequests++;
  if (state.speculative) activeSpeculativeRequests++;
  if (!state.speculative) latestApiError = '';
  updateConnectionStatus();
  const generation = apiCacheGeneration;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  const request = fetch(API_URL, {
    method: 'POST',
    signal: controller.signal,
    body: JSON.stringify({ action, params, authToken: viewerAccessToken })
  })
    .then(function(response) {
      if (!response.ok) throw new Error('通信に失敗しました（HTTP ' + response.status + '）');
      return response.json();
    })
    .then(function(result) {
      if (!result.success) {
        const error = new Error(result.message || 'APIエラー');
        error.code = result.code;
        throw error;
      }
      if (isRead && generation === apiCacheGeneration) {
        apiReadCache.delete(key);
        apiReadCache.set(key, { time: Date.now(), data: result.data });
        if (apiReadCache.size > 60) apiReadCache.delete(apiReadCache.keys().next().value);
      } else if (!isRead) {
        invalidateApiCache();
      }
      if (!state.speculative) lastApiUpdate = new Date();
      return result.data;
    })
    .catch(function(error) {
      if (error.code === 'AUTH_REQUIRED') lockViewerAccess(error.message);
      if (error.name === 'AbortError') error = new Error('通信がタイムアウトしました。もう一度お試しください');
      if (!state.speculative) latestApiError = '取得できませんでした。「更新」で再試行できます';
      throw error;
    })
    .finally(function() {
      clearTimeout(timeout);
      activeApiRequests--;
      if (state.speculative) activeSpeculativeRequests--;
      updateConnectionStatus();
      if (apiPendingReads.get(key) === request) { apiPendingReads.delete(key); apiReadStates.delete(key); }
      schedulePrefetchPump();
    });
  if (isRead) { apiPendingReads.set(key, request); apiReadStates.set(key, state); }
  return request;
}

const renderedMarkup = new WeakMap();

function renderHtmlIfChanged(element, html) {
  element.removeAttribute('aria-busy');
  const previous = renderedMarkup.get(element);
  if (previous && previous.html === html && previous.dom === element.innerHTML) return false;
  element.innerHTML = html;
  enhanceControls(element);
  renderedMarkup.set(element, { html, dom: element.innerHTML });
  return true;
}

function showLoadingState(element, chart = false) {
  element.setAttribute('aria-busy', 'true');
  element.innerHTML = '<div class="loading-placeholder' + (chart ? ' loading-chart' : '') +
    '" role="status"><span class="loading-label">読み込み中…</span>' +
    '<span class="skeleton-line"></span><span class="skeleton-line"></span>' +
    '<span class="skeleton-line"></span></div>';
}

function showEmptyState(element, message = 'この条件に該当するデータはありません') {
  renderHtmlIfChanged(element, '<div class="empty-state">' + escapeHtml(message) + '</div>');
}

function showErrorState(element, error, retry) {
  element.removeAttribute('aria-busy');
  element.replaceChildren();
  const box = document.createElement('div');
  box.className = 'error-state';
  box.setAttribute('role', 'alert');
  const message = document.createElement('p');
  message.textContent = error.message || 'データを取得できませんでした';
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'retry-button';
  button.textContent = 'もう一度読み込む';
  button.addEventListener('click', function() { retry(); });
  box.append(message, button);
  element.append(box);
}

function canPrefetch() {
  const connection = navigator.connection;
  return !!viewerAccessToken && !document.body.hasAttribute('data-locked') && document.visibilityState === 'visible' && navigator.onLine !== false &&
    !(connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType)));
}

const prefetchQueue = new Map();
let prefetchRunning = false;
let prefetchTimer = null;
let prefetchPlanKey = '';
let prefetchIdleAfter = 0;

function schedulePrefetchPump(delay = 200) {
  if (!prefetchQueue.size || prefetchTimer !== null) return;
  prefetchTimer = setTimeout(function() {
    prefetchTimer = null;
    runNextPrefetch();
  }, delay);
}

function enqueuePrefetch(action, params = {}, priority = false, id) {
  const key = id || JSON.stringify([action, params]);
  const job = { action, params, generation: apiCacheGeneration };
  if (priority) {
    const rest = [...prefetchQueue].filter(entry => entry[0] !== key);
    prefetchQueue.clear();
    prefetchQueue.set(key, job);
    rest.forEach(entry => prefetchQueue.set(...entry));
  } else if (!prefetchQueue.has(key)) prefetchQueue.set(key, job);
}

function runNextPrefetch() {
  if (prefetchRunning || !canPrefetch() || budgetSavePending || activeApiRequests > 0) return;
  const wait = prefetchIdleAfter - Date.now();
  if (wait > 0) { schedulePrefetchPump(wait); return; }
  while (prefetchQueue.size) {
    const [key, job] = prefetchQueue.entries().next().value;
    prefetchQueue.delete(key);
    if (job.generation !== apiCacheGeneration) continue;
    const params = typeof job.params === 'function' ? job.params() : job.params;
    if (!params || getCachedApiData(job.action, params) !== undefined) continue;
    prefetchRunning = true;
    callApi(job.action, params, { speculative: true })
      .catch(function() {})
      .finally(function() { prefetchRunning = false; schedulePrefetchPump(); });
    return;
  }
}

function scheduleHomePrefetch() {
  const person = currentPerson || '共通';
  const year = selectedYear, month = selectedMonth;
  const plan = JSON.stringify([apiCacheGeneration, person, year, month]);
  if (plan === prefetchPlanKey) return;
  prefetchPlanKey = plan;
  prefetchQueue.clear();
  enqueuePrefetch('getCategoryFilterMaster');
  enqueuePrefetch('getRankingData', { compact: true });
  enqueuePrefetch('getMonthlyTrendData');
  enqueuePrefetch('getBalanceData');
  enqueuePrefetch('getCalendarData', function() {
    const master = getCachedApiData('getCategoryFilterMaster') || categoryMasterCache;
    if (!master) return null;
    return { targetYear: year, targetMonth: month, selectedPerson: person,
      selectedCategories: getAllCategoriesFromMaster(master) };
  }, false, 'calendar:' + plan);
  enqueuePrefetch('getAssetData', { selectedPerson: person });
  enqueuePrefetch('getBudgetData', { targetYear: year, targetMonth: month });
  enqueuePrefetch('getMonthlyExpenseList', { targetYear: year, targetMonth: month, selectedPerson: person });
  schedulePrefetchPump(150);
}

function prefetchView(view) {
  if (!canPrefetch()) return;
  const actions = {
    trend: ['getCategoryFilterMaster', 'getMonthlyTrendData'],
    ranking: ['getCategoryFilterMaster', 'getRankingData'],
    balance: ['getBalanceData']
  }[view] || [];
  // Add in reverse so the first dependency stays first at the front of the queue.
  actions.slice().reverse().forEach(action => enqueuePrefetch(action,
    action === 'getRankingData' ? { compact: true } : {}, true));
  schedulePrefetchPump();
}

function normalizeKakeiboUrl(value) {
  let url;
  const text = String(value || '').trim();
  try { url = new URL(text.startsWith('kakeibo-auu.pages.dev/') ? 'https://' + text : text); } catch (_) { return null; }
  if (url.origin !== 'https://kakeibo-auu.pages.dev' || url.username || url.password ||
      !['/', '/connected', '/connected/', '/connected.html'].includes(url.pathname)) return null;
  const key = new URLSearchParams(url.hash.slice(1)).get('key') || url.searchParams.get('key');
  if (!key || /\s/.test(key)) return null;
  url.pathname = '/connected.html';
  url.search = '';
  url.hash = new URLSearchParams({ key }).toString();
  return url.href;
}

function openKakeibo() {
  let saved = '';
  try { saved = localStorage.getItem('etsuranKakeiboUrl') || ''; } catch (_) {}
  const target = normalizeKakeiboUrl(saved);
  if (target) { window.location.href = target; return; }
  try { localStorage.removeItem('etsuranKakeiboUrl'); } catch (_) {}
  document.getElementById('kakeiboConnectionError').textContent = '';
  document.getElementById('kakeiboConnectionUrl').value = '';
  document.getElementById('kakeiboConnectionDialog').showModal();
}

function connectKakeibo(event) {
  event.preventDefault();
  const target = normalizeKakeiboUrl(document.getElementById('kakeiboConnectionUrl').value);
  if (!target) {
    document.getElementById('kakeiboConnectionError').textContent =
      'kakeiboの専用URLを貼り付けてください。URLの末尾に「#key=…」が付いています。';
    return;
  }
  try { localStorage.setItem('etsuranKakeiboUrl', target); } catch (_) {}
  document.getElementById('kakeiboConnectionUrl').value = '';
  document.getElementById('kakeiboConnectionDialog').close();
  window.location.href = target;
}

    function formatMoney(value) {
      const num = Number(value);
      return Math.abs(num).toLocaleString() + '円';
    }

function formatSignedMoney(value) {
  const num = Number(value);
  const sign = num > 0 ? '+' : num < 0 ? '-' : '';
  return sign + Math.abs(num).toLocaleString() + '円';
}

function getBalanceClass(value) {
  const num = Number(value);

  if (num > 0) return 'positive';
  if (num < 0) return 'negative';
  return 'zero';
}

function getCurrentMonthLabel() {
const now = new Date();
return now.getFullYear() + '年' + (now.getMonth() + 1) + '月';
}

function setBar(id, rate, statusText) {
  const bar = document.getElementById(id);
  const width = Math.min(Number(rate), 100);

  bar.style.width = width + '%';

  bar.classList.remove('warning');
  bar.classList.remove('caution');
  bar.classList.remove('future');

  if (statusText === '予定支出を表示中') {
  bar.classList.add('future');
  return;
  }

  if (statusText === '使いすぎです') {
    bar.classList.add('warning');
  } else if (statusText === '少し使いすぎです') {
    bar.classList.add('caution');
  }
}

function setYearBar(id, rate) {
  const bar = document.getElementById(id);
  const width = Math.min(Number(rate), 100);

  bar.style.width = width + '%';

  bar.classList.remove('warning');
  bar.classList.remove('caution');

  if (Number(rate) >= 100) {
    bar.classList.add('warning');
  } else if (Number(rate) >= 70) {
    bar.classList.add('caution');
  }
}

function setStatus(statusText) {
  const status = document.getElementById('budgetStatus');

  status.textContent = statusText;

  status.classList.remove('warning');
  status.classList.remove('caution');

  if (statusText === '使いすぎです') {
    status.classList.add('warning');
  } else if (statusText === '少し使いすぎです') {
    status.classList.add('caution');
  }
}

function setHeroStatus(statusText) {
  const hero = document.querySelector('.hero');

  hero.classList.remove('caution');
  hero.classList.remove('warning');
  hero.classList.remove('future');

  const status = document.getElementById('budgetStatus');

  status.classList.remove('caution');
  status.classList.remove('warning');
  status.classList.remove('future');

  if (statusText === '予定支出を表示中') {
  hero.classList.add('future');
  status.classList.add('future');
  return;
}

  if (statusText === '使いすぎです') {
    hero.classList.add('warning');
  } else if (statusText === '少し使いすぎです') {
    hero.classList.add('caution');
  }
}

function getAllCategoriesFromMaster(master) {
  let categories = [];

  Object.keys(master).forEach(function(groupKey) {
    categories = categories.concat(
      master[groupKey].categories
    );
  });

  return categories;
}

function getTrendAllCategoriesFromMaster() {
  let categories = [];

  ['fixed', 'monthly', 'yearly'].forEach(function(groupKey) {
    categories = categories.concat(
      categoryMasterCache[groupKey].categories
    );
  });

  return categories;
}

function getActiveSelectedCategories() {
  if (categorySheetMode === 'trend') {
    return trendSelectedCategories;
  }

  if (categorySheetMode === 'calendar') {
    return calendarSelectedCategories;
  }

  return selectedCategories;
}

function setActiveSelectedCategories(categories) {
  if (categorySheetMode === 'trend') {
    trendSelectedCategories = categories;
    return;
  }

  if (categorySheetMode === 'calendar') {
    calendarSelectedCategories = categories;
    return;
  }

  selectedCategories = categories;
}

function getFilteredTrendData(data) {
  return data.map(function(item) {
    const filtered = {
      year: item.year,
      month: item.month,
      label: item.label,
      fixed: 0,
      monthly: 0,
      yearly: 0,
      total: 0,
      monthBudget: item.monthBudget,
      categories: item.categories
    };

    trendSelectedCategories.forEach(function(category) {
      const amount = Number(item.categories[category] || 0);
      if (!amount) return;

      if (categoryMasterCache.fixed.categories.includes(category)) {
        filtered.fixed += amount;
      }

      if (categoryMasterCache.monthly.categories.includes(category)) {
        filtered.monthly += amount;
      }

      if (categoryMasterCache.yearly.categories.includes(category)) {
        filtered.yearly += amount;
      }

      filtered.total += amount;
    });

    return filtered;
  });
}

function getCategoryButtonLabel() {

    fixedCategories.every(function(category) {
      return selectedCategories.includes(category);
    });

  const monthlyAll =
    monthlyCategories.every(function(category) {
      return selectedCategories.includes(category);
    });

  const yearlyAll =
    yearlyCategories.every(function(category) {
      return selectedCategories.includes(category);
    });

  const selectedGroupNames = [];

  if (
    fixedAll &&

      return selectedCategories.includes(category);

  if (

  ) {

  }

  const groupCategoryCount =
    (fixedAll ? fixedCategories.length : 0) +
    (monthlyAll ? monthlyCategories.length : 0) +
    (yearlyAll ? yearlyCategories.length : 0);

function renderTrendChart() {
  const chart = document.getElementById('trendChartCard');

  if (!trendDataCache || !trendDataCache[currentTrendPerson]) {
    showEmptyState(chart);
    return;
  }

  const data = getCurrentTrendData();
  if (!data.length) { showEmptyState(chart); return; }

  const isMonthlyOnlySelected = categoryMasterCache.monthly.categories.length > 0 &&
    categoryMasterCache.monthly.categories.length === trendSelectedCategories.length &&
    categoryMasterCache.monthly.categories.every(category => trendSelectedCategories.includes(category));
  const maxValue = Math.max(0, ...data.map(item => item.total),
    ...(isMonthlyOnlySelected ? data.map(item => Number(item.monthBudget) || 0) : []));
  const scaleMax = getNiceScaleMax(maxValue);
  const chartHeight = 220;
  chart.dataset.scaleMax = scaleMax;
  const chosen = data.find(item => item.year === selectedTrendYear && item.month === selectedTrendMonth) || data[data.length - 1];
  const budgetLine = isMonthlyOnlySelected ? Number(chosen.monthBudget) : null;

  const scaleLabels = [
    scaleMax,
    scaleMax * 0.75,
    scaleMax * 0.5,
    scaleMax * 0.25,
    0
  ];

  let html = '';

  html += '<div id="trendTooltip" class="trend-selected-value">棒をタップすると金額を表示します</div>';

  html += '<div class="trend-chart-area">';

  html += '<div class="trend-scale">';
  scaleLabels.forEach(function(value) {
    html += '<div>' + formatScaleLabel(value) + '</div>';
  });
  html += '</div>';

  html += '<div class="trend-plot">';

  html += '<div class="trend-grid">';
  scaleLabels.forEach(function() {
    html += '<div class="trend-grid-line"></div>';
  });
  html += '</div>';

if (budgetLine) {
  const budgetTop =
    chartHeight - ((budgetLine / scaleMax) * chartHeight);

  html +=
    '<div class="trend-budget-line" style="top:' +
    budgetTop +
    'px;">' +
      '<span class="trend-budget-label">予算 ' +
      formatMoney(budgetLine) +
      '</span>' +
    '</div>';
}

  html += '<div class="trend-real-chart">';

  data.forEach(function(item) {
    const isSelected =
      item.year === selectedTrendYear &&

function getNiceScaleMax(value) {
  if (!value || value <= 0) return 10000;

  const roughMax = value * 1.1;
  const magnitude = Math.pow(10, Math.floor(Math.log10(roughMax)));
  const normalized = roughMax / magnitude;

  let niceNormalized;

  if (normalized <= 1) {
    niceNormalized = 1;
  } else if (normalized <= 2) {
    niceNormalized = 2;
  } else if (normalized <= 5) {
    niceNormalized = 5;
  } else {
    niceNormalized = 10;
  }

  return niceNormalized * magnitude;
}

function getNiceAssetScaleMax(value) {
  if (!value || value <= 0) return 10000;

  const roughMax = value * 1.08;
  const magnitude = Math.pow(10, Math.floor(Math.log10(roughMax)));
  const normalized = roughMax / magnitude;

  let niceNormalized;

  if (normalized <= 1) {
    niceNormalized = 1;
  } else if (normalized <= 1.5) {
    niceNormalized = 1.5;
  } else if (normalized <= 2) {
    niceNormalized = 2;
  } else if (normalized <= 2.5) {
    niceNormalized = 2.5;
  } else if (normalized <= 3) {
    niceNormalized = 3;
  } else if (normalized <= 4) {
    niceNormalized = 4;
  } else if (normalized <= 5) {
    niceNormalized = 5;
  } else if (normalized <= 7.5) {
    niceNormalized = 7.5;
  } else {
    niceNormalized = 10;
  }

  return niceNormalized * magnitude;
}

function formatScaleLabel(value) {
  const rounded = Math.round(value);

  if (rounded >= 10000) {
    const man = rounded / 10000;

    if (man % 1 === 0) {
      return man + '万';
    }

    return man.toFixed(1) + '万';
  }

  return rounded.toLocaleString();
}

function renderTrendTooltipCompact(item) {
  const allCategories = getTrendAllCategoriesFromMaster();

  const fixedCategories = categoryMasterCache.fixed.categories;

  const yearlyCategories = categoryMasterCache.yearly.categories;

  const selectedCount = trendSelectedCategories.length;

  const fixedAll =
    fixedCategories.every(function(category) {
      return trendSelectedCategories.includes(category);
    });

  const monthlyAll =
    monthlyCategories.every(function(category) {
      return trendSelectedCategories.includes(category);
    });

  const yearlyAll =
    yearlyCategories.every(function(category) {
      return trendSelectedCategories.includes(category);
    });

  if (selectedCount === allCategories.length) {
    return (
      '<div class="trend-tooltip-row">' +

    return (
      '<div class="trend-tooltip-row">' +
        '<span>特別費合計</span>' +
        '<span>' + formatMoney(item.yearly) + '</span>' +
      '</div>'
    );
  }

  const rows = [];

  trendSelectedCategories.forEach(function(category) {
    const amount = Number(item.categories[category] || 0);

    if (!amount) return;

    rows.push(
      '<div class="trend-tooltip-row">' +
        '<span>' + category + '</span>' +

  if (type === 'yearly') return '特別費';

}

function isSameCategorySet(a, b) {
  if (a.length !== b.length) return false;

  return b.every(function(category) {
    return a.includes(category);
  });
}

function isTrendWholeGroupSelection() {
  const fixedCategories = categoryMasterCache.fixed.categories;
  const monthlyCategories = categoryMasterCache.monthly.categories;
  const yearlyCategories = categoryMasterCache.yearly.categories;

  const groups = [];

  if (fixedCategories.every(function(category) {
    return trendSelectedCategories.includes(category);
  })) {
    groups.push(fixedCategories);
  }

  if (monthlyCategories.every(function(category) {
    return trendSelectedCategories.includes(category);
  })) {
    groups.push(monthlyCategories);
  }

  if (yearlyCategories.every(function(category) {
    return trendSelectedCategories.includes(category);
  })) {
    groups.push(yearlyCategories);
  }

  let groupCategoryCount = 0;

  groups.forEach(function(group) {
    groupCategoryCount += group.length;
  });

  return groupCategoryCount === trendSelectedCategories.length;
}

function getTrendCategoryColor(index) {
  const colors = [
    '#5b8def',
    '#f59e0b',
    '#10b981',
    '#ef4444',
    '#8b5cf6',
    '#ec4899',
    '#14b8a6',
    '#84cc16',
    '#f97316',
    '#64748b'
  ];

  return colors[index % colors.length];
}

function showAssetMonthDetail(year, month) {

  });

  if (!item) return;

  const detail = document.getElementById('assetMonthDetail');

  const rows = Object.keys(item.types)
    .map(function(type) {
      const amount = item.types[type];
      const ratio = item.total ? Math.round((amount / item.total) * 100) : 0;

      return {
        type: type,
        amount: amount,
        ratio: ratio
      };
    })
    .sort(function(a, b) {
      return Math.abs(b.amount) - Math.abs(a.amount);

  let html = '';

  html += '<div class="asset-month-title">' +
    year + '年' + (month + 1) + '月　' +

function loadCalendarData() {
  const isCurrent = beginViewRequest('calendar');
  const container = document.getElementById('calendarContainer');
  const cached = getCachedApiData('getCalendarData', {
    targetYear: selectedCalendarYear,
    targetMonth: selectedCalendarMonth,
    selectedPerson: currentCalendarPerson,
    selectedCategories: calendarSelectedCategories
  });
  currentCalendarData = null;
  selectedCalendarDay = null;
  if (cached !== undefined) {
    currentCalendarData = cached;
    renderCalendarSkeleton(cached);
    return;
  }
  showLoadingState(container);

  getCalendarDataApi(
  selectedCalendarYear,
  selectedCalendarMonth,
  currentCalendarPerson,
  calendarSelectedCategories
)
  .then(function(data) {
    if (!isCurrent()) return;
    currentCalendarData = data;
    renderCalendarSkeleton(data);
  })
  .catch(function(error) {
    if (!isCurrent()) return;
    showErrorState(container, error, loadCalendarData);
  });
}

function renderCalendarSkeleton(calendarData) {
  const container = document.getElementById('calendarContainer');
  document.getElementById('calendarContainer').removeAttribute('aria-busy');

  const year = selectedCalendarYear;
  const month = selectedCalendarMonth;

  const firstDate = new Date(year, month, 1);

  const firstDay = firstDate.getDay();
  const mondayStartOffset = (firstDay + 6) % 7;

  const startDate = new Date(year, month, 1 - mondayStartOffset);

  const dayLabels = ['月', '火', '水', '木', '金', '土', '日'];

  let html = '';

  html += '<div class="calendar-week-header">';
  dayLabels.forEach(function(label) {
    html += '<div class="calendar-weekday">' + label + '</div>';
  });
  html += '</div>';

  html += '<div class="calendar-grid">';

  for (let i = 0; i < 42; i++) {
    const d = new Date(startDate);
    d.setDate(startDate.getDate() + i);

    const isCurrentMonth = d.getMonth() === month;
    const day = d.getDate();
    const dayData =
      isCurrentMonth && calendarData
        ? calendarData[String(day)]
        : null;
    
    const colorLevel = dayData ? Number(dayData.colorLevel || 0) : 0;

const isSelected =
  isCurrentMonth &&
  Number(selectedCalendarDay) === Number(day);

html +=
  '<div class="calendar-day calendar-level-' +
    colorLevel +
    (isSelected ? ' selected' : '') +
    (isCurrentMonth ? '' : ' outside-month') +
    (dayData ? ' has-data' : '') +
    '"' +
    (dayData ? ' onclick="showCalendarDayDetail(' + day + ')"' : '') +
  '>' +
    '<div class="calendar-day-number">' + day + '</div>';

    if (dayData) {
      html +=
        '<div class="calendar-day-amount">' +
          formatCalendarAmount(dayData.total) +
        '</div>' +
        '<div class="calendar-day-count">' +
          dayData.count + '件' +
        '</div>';
    }

    html += '</div>';
  }

 html += '</div>';

  html += '<div id="calendarDayDetail" class="calendar-day-detail">';
  html += '日付をタップすると明細を表示します';
  html += '</div>';

  renderHtmlIfChanged(container, html);
}

function formatCalendarAmount(value) {
  const num = Number(value || 0);

  if (num >= 10000) {
    return Math.round(num / 10000) + '万';
  }

  return num.toLocaleString();
}

function showCalendarDayDetail(day) {
  selectedCalendarDay = day;
  renderCalendarSkeleton(currentCalendarData);

  const detail = document.getElementById('calendarDayDetail');
  if (!detail || !currentCalendarData) return;

  const dayData = currentCalendarData[String(day)];

  if (!dayData || !dayData.items || dayData.items.length === 0) {
    detail.innerHTML = 'この日の支出はありません';
    return;
  }

  let html = '';

  html +=
    '<div class="calendar-detail-title">' +
      (selectedCalendarMonth + 1) + '/' + day +
      '　' + formatMoney(dayData.total) +
      '　' + dayData.count + '件' +
    '</div>';

  dayData.items.forEach(function(item) {
    html +=
  '<div class="calendar-detail-row">' +
    '<div class="calendar-detail-memo">' +
      (item.memo || '内容なし') +
      '（' + item.category + '）' +
    '</div>' +
    '<div class="calendar-detail-amount">' +
      formatMoney(item.amount) +

  '</div>';
  });

  detail.innerHTML = html;
}

function filterRankingItemsByPeriod(items, startDate, endDate) {
  if (!startDate || !endDate) return [];

  const startKey = dateInputToKey(startDate);
  const endKey = dateInputToKey(endDate);

  return items.filter(function(item) {
    const day = Number(String(item.date).split('/')[1]);

    const itemKey =
      Number(item.year) * 10000 +
      (Number(item.month) + 1) * 100 +
      day;

    return itemKey >= startKey && itemKey <= endKey;
  });
}

function dateInputToKey(value) {
  const parts = value.split('-');

  return (
    Number(parts[0]) * 10000 +
    Number(parts[1]) * 100 +
    Number(parts[2])
  );
}

const modalReturnFocus = new Map();
function openModal(id) {
  const modal = document.getElementById(id);
  if (!modal.classList.contains('open')) modalReturnFocus.set(id, document.activeElement);
  modal.classList.add('open');
  modal.setAttribute('aria-modal', 'true');
  document.body.classList.add('modal-open');
  const closeButton = modal.querySelector('.sheet-close');
  if (closeButton) closeButton.focus({ preventScroll: true });
}

function closeModal(id) {
  const modal = document.getElementById(id);
  modal.classList.remove('open');
  modal.removeAttribute('aria-modal');
  if (!document.querySelector('.sheet-modal.open')) document.body.classList.remove('modal-open');
  const previous = modalReturnFocus.get(id);
  if (previous && previous.isConnected) previous.focus({ preventScroll: true });
  modalReturnFocus.delete(id);
}

    html +=

  html +=
    '<div class="category-group">' +
      '<div class="category-group-title">' +
        '<input type="checkbox"' +
        ' id="allCategoryCheckbox"' +
        (isAllCategoriesSelected() ? ' checked' : '') +
        ' onclick="toggleAllCategories(this)">' +
        '<span>すべて選択</span>' +
      '</div>' +
    '</div>';

  const groupKeys = Object.keys(categoryMasterCache).filter(function(groupKey) {
    return groupKey !== 'income';
  });

  groupKeys.forEach(function(groupKey) {
    const group = categoryMasterCache[groupKey];

    const groupSelectedCount =
    group.categories.filter(function(category) {
    return getActiveSelectedCategories().includes(category);
    }).length;

    const shouldOpenGroup =
    groupSelectedCount > 0 &&
    groupSelectedCount < group.categories.length;

    const categoryItemsClass =
    shouldOpenGroup
    ? 'category-items'
    : 'category-items hidden';

    const toggleMark =
    shouldOpenGroup ? '▼' : '▶';  

    html +=
      '<div class="category-group">' +
        '<div class="category-group-title" onclick="toggleCategoryGroup(this)">' +

          '<input type="checkbox"' +
          ' class="category-group-checkbox"' +
          ' data-group="' + groupKey + '"' +
          (isCategoryGroupFullySelected(groupKey) ? ' checked' : '') +
          ' onclick="event.stopPropagation(); toggleCategoryGroupCheck(this)">' +

          '<span>' + group.label + '</span>' +
          '<span class="category-toggle-mark">' + toggleMark + '</span>' +
        '</div>' +

        '<div class="' + categoryItemsClass + '">';

    group.categories.forEach(function(category) {
      html +=
        '<label class="category-item">' +
          '<input type="checkbox"' +
          ' class="category-item-checkbox"' +
          ' data-category="' + category + '"' +
          (getActiveSelectedCategories().includes(category) ? ' checked' : '') +
          ' onchange="toggleCategoryItem(this)">' +
          '<span>' + category + '</span>' +
        '</label>';
    });

    html +=
        '</div>' +
      '</div>';
  });

  renderHtmlIfChanged(content, html);
}

function toggleCategoryGroup(element) {
  const group = element.closest('.category-group');
  const items = group.querySelector('.category-items');
  const mark = group.querySelector('.category-toggle-mark');

  items.classList.toggle('hidden');
  mark.textContent = items.classList.contains('hidden') ? '▶' : '▼';
}

function toggleCategoryGroupCheck(checkbox) {
  const groupKey = checkbox.dataset.group;
  const isChecked = checkbox.checked;

  const group = checkbox.closest('.category-group');
  const itemCheckboxes = group.querySelectorAll('.category-item-checkbox');

  let activeCategories = getActiveSelectedCategories();

  itemCheckboxes.forEach(function(itemCheckbox) {
    const category = itemCheckbox.dataset.category;

    itemCheckbox.checked = isChecked;

    if (isChecked) {
      if (!activeCategories.includes(category)) {
        activeCategories.push(category);
      }
    } else {
      activeCategories = activeCategories.filter(function(item) {
        return item !== category;
      });
    }
  });

  setActiveSelectedCategories(activeCategories);
  updateAllCategoryCheckbox();
}

function toggleCategoryItem(checkbox) {
  const category = checkbox.dataset.category;

  let activeCategories = getActiveSelectedCategories();

  if (checkbox.checked) {
    if (!activeCategories.includes(category)) {
      activeCategories.push(category);
    }
  } else {
    activeCategories = activeCategories.filter(function(item) {
      return item !== category;
    });
  }

  setActiveSelectedCategories(activeCategories);

  syncCategoryGroupCheck(checkbox);
}

function syncCategoryGroupCheck(checkbox) {
  const group = checkbox.closest('.category-group');
  const groupCheckbox = group.querySelector('.category-group-checkbox');
  const itemCheckboxes = group.querySelectorAll('.category-item-checkbox');

  const allChecked = Array.from(itemCheckboxes).every(function(itemCheckbox) {
    return itemCheckbox.checked;
  });

  groupCheckbox.checked = allChecked;
  updateAllCategoryCheckbox();
}

function updateAllCategoryCheckbox() {
  const allCheckbox =
    document.getElementById('allCategoryCheckbox');

  if (!allCheckbox) return;

  allCheckbox.checked = isAllCategoriesSelected();
}

function isCategoryGroupFullySelected(groupKey) {
  const activeCategories = getActiveSelectedCategories();
  const groupCategories = categoryMasterCache[groupKey].categories;

  return groupCategories.every(function(category) {
    return activeCategories.includes(category);
  });
}

function isAllCategoriesSelected() {
  if (!categoryMasterCache) return false;

  const activeCategories = getActiveSelectedCategories();
  const allCategories = getTrendAllCategoriesFromMaster();

  return allCategories.every(function(category) {
    return activeCategories.includes(category);
  });
}

function toggleAllCategories(checkbox) {
  let activeCategories = [];

  if (checkbox.checked) {
    Object.keys(categoryMasterCache).forEach(function(groupKey) {
      if (groupKey === 'income') {
        return;
      }

      categoryMasterCache[groupKey].categories.forEach(function(category) {
        activeCategories.push(category);

  setActiveSelectedCategories(activeCategories);

}

  openModal('expenseModal');
  modal.classList.remove('fullscreen');
  const cached = getCachedApiData('getMonthlyExpenseList', {
    targetYear: year, targetMonth: month, selectedPerson: person
  });
  if (cached !== undefined) {
    renderExpenseList(cached, year, month, person, type, source);
    return;
  }
  showLoadingState(content);

  getMonthlyExpenseListApi(
  year,
  month,
  person
)
  .then(function(groups) {
    if (!isCurrent()) return;
    renderExpenseList(groups, year, month, person, type, source);
  })
  .catch(function(error) {
    if (!isCurrent()) return;
    showErrorState(content, error, () => openExpenseList(year, month, person, type, source));
  });
}

function closeExpenseList() {
  beginViewRequest('expense');
  closeModal('expenseModal');
}

function handleSheetTouchStart(event) {
  sheetSwipeActive = event.touches.length === 1 && !!event.target.closest('.sheet-header');
  if (!sheetSwipeActive) return;
  sheetTouchStartY = event.touches[0].clientY;
  sheetTouchStartX = event.touches[0].clientX;
}

function handleSheetTouchEnd(event) {
  if (!sheetSwipeActive) return;
  sheetSwipeActive = false;
  if (Math.abs(event.changedTouches[0].clientX - sheetTouchStartX) > 50) return;
  const endY = event.changedTouches[0].clientY;
  const diffY = sheetTouchStartY - endY;

  const modal = document.getElementById('expenseModal');
  const panel = document.querySelector('#expenseModal .sheet-panel');

  if (diffY > 60) {
    modal.classList.add('fullscreen');
  }

  if (diffY < -60 && panel.scrollTop === 0) {
    modal.classList.remove('fullscreen');
    closeExpenseList();
  }
}

function renderExpenseList(groups, year, month, person, type, source) {
  const content = document.getElementById('expenseListContent');
  document.getElementById('expenseListContent').removeAttribute('aria-busy');
  const typeLabel = getTrendTypeLabel(type);

  const html =
    '<div class="expense-page-title">' +
    year + '年' +
    (month + 1) + '月　' +
    getPersonDisplayName(person) + '　' +
    typeLabel +
    '</div>' +
    (renderExpenseSectionsByType(groups, type, source) || '<div class="empty-state">この条件に該当する支出はありません</div>');
  renderHtmlIfChanged(content, html);
}

function filterExpenseItemsByTrendCategories(items) {
  if (!items) return [];

  return items.filter(function(item) {
    return trendSelectedCategories.includes(item.category);
  });
}


function renderExpenseSectionsByType(groups, type, source) {
  const shouldFilterByTrendCategories = source === 'trend';

  const fixedItems = shouldFilterByTrendCategories
    ? filterExpenseItemsByTrendCategories(groups.fixed)
    : (groups.fixed || []);

  const monthlyItems = shouldFilterByTrendCategories
    ? filterExpenseItemsByTrendCategories(groups.monthly)
    : (groups.monthly || []);

  const yearlyItems = shouldFilterByTrendCategories
    ? filterExpenseItemsByTrendCategories(groups.yearly)
    : (groups.yearly || []);

  if (type === 'fixed') {
    return renderExpenseSection('固定費', fixedItems);
  }

  if (type === 'monthly') {
    return renderExpenseSection('日常費', monthlyItems);
  }

  if (type === 'yearly') {
    return renderExpenseSection('特別費', yearlyItems);
  }

  return (
    renderExpenseSection('固定費', fixedItems) +
    renderExpenseSection('日常費', monthlyItems) +
    renderExpenseSection('特別費', yearlyItems)
  );
}

function getPersonDisplayName(person) {
  if (person === 'ぐんま') return 'ぐん';
  return person;
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function renderExpenseSection(title, items) {

  if (!items || items.length === 0) {
    return '';
  }

  const total = items.reduce(function(sum, item) {
    return sum + Number(item.amount);
  }, 0);

  let html = '';

  html += '<div class="expense-section">';
  html +=
  '<div class="expense-total">' +
  '<span>' + title + '合計</span>' +
  '<span>' + formatMoney(total) + '</span>' +
  '</div>';

  items.forEach(function(item) {

    html += '<div class="expense-row">';

    html += '<div class="expense-left">';
    html += escapeHtml(item.date) +
      '　' +
      escapeHtml(item.category) +
      '　' +
      escapeHtml(item.memo);
    html += '</div>';

    html += '<div class="expense-amount">';
    html += formatMoney(item.amount);
    html += '</div>';

    html += '</div>';
  });

  html += '</div>';

  return html;
}

// ======================================
// 初期化
// ======================================

document
  .querySelector('#expenseModal .sheet-panel')
  .addEventListener('touchstart', handleSheetTouchStart, { passive: true });

document
  .querySelector('#expenseModal .sheet-panel')
  .addEventListener('touchend', handleSheetTouchEnd, { passive: true });

function closeTopModal() {
  if (document.getElementById('expenseModal').classList.contains('open')) closeExpenseList();
  else if (document.getElementById('periodModal').classList.contains('open')) closePeriodSheet();
  else if (document.getElementById('categoryModal').classList.contains('open')) closeCategorySheet();
}

document.querySelectorAll('.sheet-modal').forEach(function(modal) {
  modal.addEventListener('click', event => { if (event.target === modal) closeTopModal(); });
});
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') closeTopModal();
  if (event.key === 'Tab') {
    const modal = document.querySelector('.sheet-modal.open');
    if (!modal) return;
    const controls = [...modal.querySelectorAll('button, input, [tabindex="0"]')].filter(el => !el.disabled && el.getClientRects().length);
    const first = controls[0], last = controls[controls.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
  const target = event.target;
  if ((event.key === 'Enter' || event.key === ' ') && target.matches('[role="button"][onclick]')) {
    event.preventDefault(); target.click();
  }
});
// Dynamic chart controls get the same keyboard behavior as static controls.
function enhanceControls(root) {
  root.querySelectorAll('div[onclick]').forEach(function(control) {
    control.setAttribute('role', 'button');
    control.tabIndex = 0;
  });
}
// Pause the queue between requests while the user is interacting; an in-flight
// GAS read is allowed to finish because aborting HTTP does not stop server work.
['pointerdown', 'keydown', 'touchstart'].forEach(function(event) {
  document.addEventListener(event, function() {
    prefetchIdleAfter = Date.now() + 600;
    schedulePrefetchPump(650);
  }, { passive: true });
});
document.addEventListener('visibilitychange', () => schedulePrefetchPump());
window.addEventListener('online', () => schedulePrefetchPump());
if (navigator.connection && navigator.connection.addEventListener) {
  navigator.connection.addEventListener('change', () => schedulePrefetchPump());
}
document.querySelectorAll('[data-nav-icon]').forEach(el => { el.innerHTML = iconSvg(el.dataset.navIcon); });
document.querySelectorAll('.calendar-shortcut').forEach(el => { el.innerHTML = iconSvg('calendar'); });
enhanceControls(document);
document.querySelectorAll('[data-prefetch]').forEach(function(control) {
  ['pointerenter', 'focus', 'touchstart'].forEach(event => control.addEventListener(event,
    () => prefetchView(control.dataset.prefetch), { passive: true }));
});

function lockViewerAccess(message = '', forgetRemembered = true) {
  const connectionDialog = document.getElementById('kakeiboConnectionDialog');
  if (connectionDialog && connectionDialog.open) connectionDialog.close();
  viewerAccessToken = '';
  try { sessionStorage.removeItem('etsuranViewerToken'); } catch (_) {}
  if (forgetRemembered) {
    try { localStorage.removeItem('etsuranViewerToken'); } catch (_) {}
  }
  invalidateApiCache();
  document.body.setAttribute('data-locked', '');
  document.getElementById('viewerPassword').value = '';
  document.getElementById('viewerAuthMessage').textContent = message;
}

async function unlockViewerAccess(event) {
  if (event) event.preventDefault();
  const input = document.getElementById('viewerPassword');
  const button = document.getElementById('viewerLoginButton');
  const message = document.getElementById('viewerAuthMessage');
  if (button.disabled) return;
  viewerAccessToken = input.value;
  if (!viewerAccessToken) return;
  invalidateApiCache();
  button.disabled = true;
  message.textContent = '確認中…';
  try {
    const result = await callApi('getViewerAccess');
    if (result.authorized !== true) throw new Error('認証を確認できませんでした。');
    try { sessionStorage.setItem('etsuranViewerToken', viewerAccessToken); } catch (_) {}
    try {
      if (document.getElementById('viewerRemember').checked) {
        localStorage.setItem('etsuranViewerToken', viewerAccessToken);
      } else {
        localStorage.removeItem('etsuranViewerToken');
      }
    } catch (_) {}
    input.value = '';
    message.textContent = '';
    hideAllScreens();
    document.getElementById('homeScreen').classList.remove('hidden');
    activateNavigation('home');
    initializePerson();
    document.body.removeAttribute('data-locked');
  } catch (error) {
    lockViewerAccess(error.message.startsWith('Unknown action:')
      ? '先にGASの認証対応版を反映し、アクセスコードを設定してください。' : error.message,
      error.code === 'AUTH_REQUIRED' || error.code === 'AUTH_NOT_CONFIGURED' || error.message.startsWith('Unknown action:'));
  } finally { button.disabled = false; }
}

document.getElementById('kakeiboConnectionForm').addEventListener('submit', connectKakeibo);
document.getElementById('viewerLoginForm').addEventListener('submit', unlockViewerAccess);
let savedViewerToken = '', rememberedViewerToken = '';
try { savedViewerToken = sessionStorage.getItem('etsuranViewerToken') || ''; } catch (_) {}
try { rememberedViewerToken = localStorage.getItem('etsuranViewerToken') || ''; } catch (_) {}
document.getElementById('viewerRemember').checked = !!rememberedViewerToken;
document.getElementById('viewerPassword').value = savedViewerToken || rememberedViewerToken;
window.addEventListener('storage', function(event) {
  if (event.key === 'etsuranViewerToken' && event.newValue === null) lockViewerAccess();
});
if (document.getElementById('viewerPassword').value) unlockViewerAccess();

</script>
